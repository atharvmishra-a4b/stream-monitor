# Prometheus and Grafana for trying this out on your own machine. Nothing here needs building.
#   docker compose up
# Grafana: http://localhost:3000     Prometheus: http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver     # lets the laptops push readings to /api/v1/write
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./stack/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./stack/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"            # no login: for local testing only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/streaming-laptops.json
    volumes:
      - ./stack/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./stack/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  promdata:
